[versions]
robocode-classic = "1.11.1"
junit = "6.1.3"
asm = "9.10.1"
protobuf = "4.31.1"

[libraries]
robocode-classic-api = { module = "net.sf.robocode:robocode.api", version.ref = "robocode-classic" }
robocode-classic-core = { module = "net.sf.robocode:robocode.core", version.ref = "robocode-classic" }
robocode-classic-battle = { module = "net.sf.robocode:robocode.battle", version.ref = "robocode-classic" }
robocode-classic-host = { module = "net.sf.robocode:robocode.host", version.ref = "robocode-classic" }
robocode-classic-repository = { module = "net.sf.robocode:robocode.repository", version.ref = "robocode-classic" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
