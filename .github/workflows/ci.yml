name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  java:
    name: Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  difftest:
    name: Engine, server and live battles against classic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./gradlew :tools:difftest:installDist :robots:samples:jar :clients:java-determinism:jar :clients:java-compat:installDist
      - name: Record classic battles (sample robots)
        run: tools/difftest/record-samples.sh "$RUNNER_TEMP/recordings"
      - name: Replay them in the engine and through the server
        run: cargo test --locked -p robocode-s-difftest
        env:
          ROBOCODES_RECORDINGS: ${{ runner.temp }}/recordings
      - name: Fight them live with real robot processes
        run: cargo run --locked --release -p robocode-s-difftest --bin live -- "$RUNNER_TEMP"/recordings/*.jsonl.gz
        env:
          ROBOCODES_JAVA: ${{ env.JAVA_HOME }}/bin/java
      - name: Fight them with the command-line battle runner
        run: cargo test --locked --release -p robocode-s-cli
        env:
          ROBOCODES_RECORDINGS: ${{ runner.temp }}/recordings
          ROBOCODES_JAVA: ${{ env.JAVA_HOME }}/bin/java

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
