[package]
name = "robocode-s-runner"
description = "Launches robot processes (local process, container, remote agent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ureq = "3.4.2"
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
robocode-s-engine.workspace = true
robocode-s-protocol.workspace = true
robocode-s-server.workspace = true

# The Linux sandbox (`src/sandbox/linux.rs`): seccomp, Landlock and rlimits; whether a
# process runs (`src/housekeeping.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The Windows sandbox (`src/sandbox/windows.rs`): an AppContainer, ACLs and a Job Object.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# What the Windows sandbox's tests try.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_DataExchange",
    "Win32_System_Registry",
] }
