[package]
name = "robocode-s-gui"
description = "robocode-s desktop GUI: battle setup, live viewer, debug paint, replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "robocode-s-gui"
path = "src/main.rs"

[dependencies]
robocode-s-engine.workspace = true
robocode-s-protocol.workspace = true
robocode-s-server.workspace = true
robocode-s-runner.workspace = true
robocode-s-replay.workspace = true
robocode-s-rumble-client.workspace = true
robocode-s-rumble-core.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui-file-dialog = { version = "0.15.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Sound: PulseAudio's protocol in pure Rust on Linux (no ALSA headers needed to build),
# cpal (WASAPI, Core Audio) on Windows and macOS.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
pulseaudio = "0.3.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.18.2"

# The terminal a release build was started from (`src/console.rs`); the system's parts of
# our own window frame (`src/window.rs`).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# The .exe's icon and version information (`build.rs`), only when building for Windows.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
