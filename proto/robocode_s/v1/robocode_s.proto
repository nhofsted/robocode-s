// SPDX-License-Identifier: EPL-2.0
//
// robocode-s wire protocol, version 1 (docs/design.md §5, docs/engine-spec.md §11).
//
// Transport: any byte stream (stdio, TCP; TLS off loopback, design §5.1). Every message is a
// ClientMessage or ServerMessage, preceded by its length as a protobuf varint.
//
// A connection starts with Hello / HelloAck and then has one role:
//   robot     one robot in one battle: the lockstep turn loop
//   runner    a runner agent (`robocode-s agent`): launches robot processes on the
//             server's request and relays their stdio (ADR 0020)
//   observer  a viewer (GUI, recorder) that follows a battle and may control it
//
// Units: distances in pixels, angles in radians (0 = north, clockwise), unless a
// field says otherwise. Colors are ARGB.
//
// All double fields are `optional`, so they are always written when set. With
// implicit presence some implementations (Rust's prost) skip -0.0, because it
// compares equal to the default 0.0; the protobuf spec says -0.0 must be sent, and
// robocode-s needs every bit (ADR 0003).

syntax = "proto3";

package robocode_s.v1;

option java_package = "io.github.nhofsted.robocodes.protocol.v1";
option java_multiple_files = true;
option csharp_namespace = "RobocodeS.Protocol.V1";

// ============================================================================
// Envelopes
// ============================================================================

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    // robot
    Execute execute = 10;
    // runner
    LaunchResult launch_result = 20;
    RobotExited robot_exited = 21;
    JarRequest jar_request = 22;
    // observer
    ObserverControl observer_control = 30;
  }
}

message ServerMessage {
  oneof msg {
    HelloAck hello_ack = 1;
    Error error = 2;
    // robot
    RoundStart round_start = 10;
    Tick tick = 11;
    RoundOver round_over = 12;
    BattleOver battle_over = 13;
    // runner
    LaunchRobot launch_robot = 20;
    StopRobot stop_robot = 21;
    JarData jar_data = 22;
    // observer
    BattleInfo battle_info = 30;
    TurnSnapshot turn_snapshot = 31;
    RoundResult round_result = 32;
  }
}

// ============================================================================
// Handshake
// ============================================================================

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ROBOT = 1;
  ROLE_RUNNER = 2;
  ROLE_OBSERVER = 3;
}

message Hello {
  ProtocolVersion version = 1;
  Role role = 2;
  // Robots: the one-time token the server gave the runner in LaunchRobot.
  // Runners and observers: their credential (empty on loopback).
  string token = 3;
  // Optional features the client supports.
  repeated string features = 4;
  // Runners only.
  RunnerInfo runner = 5;
  // Robots started by an IDE (design §5.2, 1.2): the robot says who it is, as the
  // server otherwise tells it in HelloAck. Only on the IDE listener.
  RobotDescription robot_description = 6;
}

// What a robot host knows about the robot it was started with (classic's repository):
// the fields `RobotHost --describe` prints for one robot. The server names it for the
// battle (unique names, as classic's Battle.createPeers) and answers with HelloAck.
message RobotDescription {
  // Unique full class name with version, e.g. "jk.mega.DrussGT 3.1.16"; classic's
  // lookup name.
  string name = 1;
  string full_class_name = 2;
  RobotType type = 3;
  // Classic's team id when the robot is a team (not accepted from an IDE yet).
  optional string team_id = 4;
  // What the robot runs on, e.g. "JVM 21.0.12".
  string platform = 5;
  // The deterministic rules its host follows (0: unknown).
  uint32 deterministic_rules = 6;
}

message HelloAck {
  ProtocolVersion version = 1;
  // Features both sides support.
  repeated string features = 2;
  // Robots only: who they are and the rules of the battle.
  RobotStatics robot = 3;
}

// The connection is refused or ended; the server closes it afterwards.
message Error {
  string message = 1;
}

// The first message to a robot host started warm (`RobotHost --stdio --warm`, design
// §6.2): it waits for it on its stdin, before the Hello of the protocol. The runner sends
// it, so it isn't part of the ClientMessage/ServerMessage envelopes. Sandbox grants are
// fixed when the process starts, so the robot's jars are not granted but put into the
// host's home beforehand.
message RobotAssignment {
  // Classic name to look the robot up by, e.g. `sample.Fire` or `jk.mega.DrussGT 3.1.16`.
  string robot = 1;
  // The battle seed for the robot's own random streams (ADR 0009).
  int64 seed = 2;
  // Deterministic mode: the host was started with the determinism agent and its flags.
  bool deterministic = 3;
  // The robot's jars, as paths relative to the host's home: the host moves them to where
  // classic's repository reads them, then looks the robot up.
  repeated string jars = 4;
}

// ============================================================================
// Battle description
// ============================================================================

message BattleRules {
  int32 battlefield_width = 1;
  int32 battlefield_height = 2;
  int32 num_rounds = 3;
  optional double gun_cooling_rate = 4;
  int64 inactivity_time = 5;
  bool hide_enemy_names = 6;
  int32 sentry_border_size = 7;
  // Deterministic mode (ADR 0005): no timing-based skipped turns.
  bool deterministic = 8;
}

// A robot's fixed description (classic's RobotStatics).
message RobotStatics {
  // Unique name, e.g. "jk.mega.DrussGT 3.1.16" or "sample.Fire (2)".
  string name = 1;
  string short_name = 2;
  string very_short_name = 3;
  // Full class name without version or suffix.
  string full_class_name = 4;
  string short_class_name = 5;
  int32 robot_index = 6;
  RobotType type = 7;
  // Team robots only.
  optional string team_name = 8;
  int32 team_index = 9;  // -1 without a team
  bool team_leader = 10;
  repeated string team_members = 11;
  BattleRules rules = 12;
}

message RobotType {
  bool junior = 1;
  bool advanced = 2;
  bool team = 3;
  bool droid = 4;
  bool sentry = 5;
  bool interactive = 6;
  bool paint = 7;
}

// ============================================================================
// Robot role: the lockstep turn loop (design §5.3, engine-spec §11)
// ============================================================================
//
//   server -> RoundStart          the robot creates its instance and runs it
//   robot  -> Execute             first command state (applies in turn 1)
//   server -> Tick                results of turn 1
//   robot  -> Execute             ...
//   server -> RoundOver           the robot stops; next round or BattleOver
//
// Commands sent in Execute after Tick n take effect in turn n + 1.

// The robot's command state (classic's ExecCommands). The robot sends all of it
// with every Execute; the server returns its updated copy in Tick.
message RobotCommands {
  optional double body_turn_remaining = 1;
  optional double gun_turn_remaining = 2;
  optional double radar_turn_remaining = 3;
  optional double distance_remaining = 4;
  bool adjust_gun_for_body_turn = 5;
  bool adjust_radar_for_gun_turn = 6;
  bool adjust_radar_for_body_turn = 7;
  // Whether the robot set adjust_radar_for_body_turn itself (classic API detail).
  bool adjust_radar_for_body_turn_set = 8;
  optional double max_turn_rate = 9;
  optional double max_velocity = 10;
  Colors colors = 11;
  // The rest is only sent by robots, never returned.
  bool scan = 12;
  bool io_robot = 13;
  repeated BulletCommand bullets = 14;
  repeated TeamMessage team_messages = 15;
}

message Colors {
  int32 body = 1;
  int32 gun = 2;
  int32 radar = 3;
  int32 scan = 4;
  int32 bullet = 5;
  // The parts the robot set itself (setColors, setBodyColor, ...), as bits: 1 body, 2 gun,
  // 4 radar, 8 scan, 16 bullet. The values of the others are classic's defaults. 0 from
  // hosts that don't say (older ones): there body, gun and radar all classic's default
  // (0xFF29298C) mean none set. Not battle state: not part of a recording's snapshot hash,
  // so hosts that send it and hosts that don't agree on battle hashes.
  uint32 set_parts = 6;
}

message BulletCommand {
  int32 bullet_id = 1;
  optional double power = 2;
  // Fire assist (basic robots): aim here if the radar turned with the gun.
  bool fire_assist_valid = 3;
  optional double fire_assist_angle = 4;
}

message TeamMessage {
  string sender = 1;
  // Absent: all teammates.
  optional string recipient = 2;
  // Classic Java robots: a serialized java.io.Serializable.
  bytes payload = 3;
}

message RoundStart {
  int32 round = 1;
  RobotStatus status = 2;
  RobotCommands commands = 3;
}

message Execute {
  // The turn whose results this robot last received (0 after RoundStart).
  int64 turn = 1;
  RobotCommands commands = 2;
  // Console output since the last Execute.
  string output = 3;
  // Debug painting, only while the server has enabled it (Tick.paint_enabled).
  repeated PaintOp paint = 4;
  // CPU time the robot used for this turn, measured by the runner or library (ns). In
  // deterministic mode: its counted work as virtual time (ADR 0014).
  uint64 cpu_nanos = 5;
  // The robot's code crashed: classic drains its energy to 0 for good (drainEnergy).
  bool drain_energy = 6;
  // The robot's thread ended (crash or disable); no more Executes this round. Without
  // commands, the previous command state stays in effect.
  bool stopped = 7;
  // The robot misbehaved and is disabled (classic's punishBadBehavior).
  bool disable = 8;
  // Debug properties the robot set since the last Execute (setDebugProperty), in order.
  repeated DebugProperty debug_properties = 9;
  // The robot's code started a thread of its own (also through Timer or an executor). Such
  // threads run in real time, outside the work meter and the virtual clock: the robot's
  // battles are not reproducible (ADR 0014, ADR 0024). Sticky: once true, true on every
  // later Execute. It may also come alone, on an Execute whose turn is -1 (never an answer
  // to a Tick), when the thread starts. The server takes it from any Execute.
  bool threads = 10;
}

// A robot's debug property (classic's setDebugProperty): shown in its console. An empty
// value (classic's null or "") removes the property.
message DebugProperty {
  string key = 1;
  string value = 2;
}

message Tick {
  int64 turn = 1;
  RobotStatus status = 2;
  // The server's copy of the command state (remaining values updated); the robot
  // continues from it.
  RobotCommands commands = 3;
  // In the order the engine generated them (engine-spec §12).
  repeated Event events = 4;
  repeated TeamMessage team_messages = 5;
  repeated BulletStatus bullet_updates = 6;
  // The robot stops (dead, halted, or the round is over). A robot that is still alive
  // and halted sends one final Execute; its commands take effect, as in classic
  // (executeImpl stores the commands before it throws).
  bool halt = 7;
  // The robot should keep waiting for the battle to end instead of stopping.
  bool should_wait = 8;
  bool paint_enabled = 9;
  // CPU time budget for the next turn (ns); in deterministic mode, of counted work (ADR 0018).
  uint64 budget_nanos = 10;
}

message RoundOver {
  int32 round = 1;
}

message BattleOver {
  bool aborted = 1;
  // Observers only: the rounds fought and the final results, by robot index (empty for
  // robots).
  int32 rounds = 2;
  repeated Results results = 3;
}

// classic's RobotStatus
message RobotStatus {
  optional double energy = 1;
  optional double x = 2;
  optional double y = 3;
  optional double body_heading = 4;
  optional double gun_heading = 5;
  optional double radar_heading = 6;
  optional double velocity = 7;
  optional double body_turn_remaining = 8;
  optional double radar_turn_remaining = 9;
  optional double gun_turn_remaining = 10;
  optional double distance_remaining = 11;
  optional double gun_heat = 12;
  int32 others = 13;
  int32 num_sentries = 14;
  int32 round = 15;
  int32 num_rounds = 16;
  int64 time = 17;
}

// An update of one of the robot's own bullets.
message BulletStatus {
  int32 bullet_id = 1;
  optional double x = 2;
  optional double y = 3;
  optional string victim = 4;
  bool active = 5;
}

// ============================================================================
// Events (engine-spec §12); names are as the receiving robot sees them
// ============================================================================

message Event {
  oneof kind {
    ScannedRobot scanned_robot = 1;
    HitWall hit_wall = 2;
    HitRobot hit_robot = 3;
    HitByBullet hit_by_bullet = 4;
    BulletHit bullet_hit = 5;
    BulletHitBullet bullet_hit_bullet = 6;
    BulletMissed bullet_missed = 7;
    RobotDeath robot_death = 8;
    Death death = 9;
    Win win = 10;
    RoundEnded round_ended = 11;
    BattleEnded battle_ended = 12;
    SkippedTurn skipped_turn = 13;
    // A mouse or keyboard event on the battlefield (interactive robots only).
    InputEvent input = 14;
  }
}

message Bullet {
  int32 bullet_id = 1;
  string owner = 2;
  optional string victim = 3;
  optional double heading = 4;
  optional double x = 5;
  optional double y = 6;
  optional double power = 7;
  bool active = 8;
}

message ScannedRobot {
  string name = 1;
  optional double energy = 2;
  optional double bearing = 3;
  optional double distance = 4;
  optional double heading = 5;
  optional double velocity = 6;
  bool sentry = 7;
}

message HitWall {
  optional double bearing = 1;
}

message HitRobot {
  string name = 1;
  optional double bearing = 2;
  optional double energy = 3;
  bool at_fault = 4;
}

message HitByBullet {
  optional double bearing = 1;
  Bullet bullet = 2;
}

message BulletHit {
  string name = 1;
  optional double energy = 2;
  Bullet bullet = 3;
}

message BulletHitBullet {
  Bullet bullet = 1;
  Bullet hit_bullet = 2;
}

message BulletMissed {
  Bullet bullet = 1;
}

message RobotDeath {
  string name = 1;
}

message Death {}

// A mouse or keyboard event on the battlefield (classic's interactive events, design
// §5.2): an observer sends it, the server records it and delivers it with the next
// turn's events to every running interactive robot (classic's isInteractiveRobot).
// Fields are those of the java.awt event classic wraps (robocode.MouseMovedEvent, ...).
message InputEvent {
  oneof kind {
    MouseInput mouse = 1;
    KeyInput key = 2;
  }
}

enum MouseAction {
  MOUSE_ACTION_UNSPECIFIED = 0;
  MOUSE_MOVED = 1;
  MOUSE_DRAGGED = 2;
  MOUSE_PRESSED = 3;
  MOUSE_RELEASED = 4;
  MOUSE_CLICKED = 5;
  MOUSE_ENTERED = 6;
  MOUSE_EXITED = 7;
  MOUSE_WHEEL_MOVED = 8;
}

message MouseInput {
  MouseAction action = 1;
  // Battlefield coordinates, y up (classic mirrors the view's y), rounded to pixels.
  int32 x = 2;
  int32 y = 3;
  // java.awt.event.MouseEvent.BUTTON1..3 (left, middle, right); 0: none.
  int32 button = 4;
  int32 click_count = 5;
  // java.awt.event.InputEvent's extended modifiers (SHIFT_DOWN_MASK, ...).
  int32 modifiers = 6;
  // Wheel only: MouseWheelEvent.WHEEL_UNIT_SCROLL (0), the scroll amount, and the
  // rotation in notches (negative: away from the user, up).
  int32 scroll_type = 7;
  int32 scroll_amount = 8;
  int32 wheel_rotation = 9;
  // When it happened (InputEvent.getWhen), ms since the epoch.
  int64 when = 10;
}

enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_PRESSED = 1;
  KEY_RELEASED = 2;
  KEY_TYPED = 3;
}

message KeyInput {
  KeyAction action = 1;
  // java.awt.event.KeyEvent.VK_*; VK_UNDEFINED (0) for typed keys.
  int32 key_code = 2;
  // The UTF-16 character; CHAR_UNDEFINED (0xFFFF) for keys without one.
  int32 key_char = 3;
  // KeyEvent.KEY_LOCATION_* (0: unknown, as for typed keys; 1: standard).
  int32 key_location = 4;
  // java.awt.event.InputEvent's extended modifiers (SHIFT_DOWN_MASK, ...).
  int32 modifiers = 5;
  // When it happened (InputEvent.getWhen), ms since the epoch.
  int64 when = 6;
}

message Win {}

message RoundEnded {
  int32 round = 1;
  int64 turns = 2;
  int64 total_turns = 3;
}

message BattleEnded {
  bool aborted = 1;
  Results results = 2;
}

message SkippedTurn {
  int64 turn = 1;
}

// A contestant's results (classic's BattleResults, unrounded).
message Results {
  string name = 1;
  int32 rank = 2;
  optional double score = 3;
  optional double survival = 4;
  optional double last_survivor_bonus = 5;
  optional double bullet_damage = 6;
  optional double bullet_damage_bonus = 7;
  optional double ram_damage = 8;
  optional double ram_damage_bonus = 9;
  int32 firsts = 10;
  int32 seconds = 11;
  int32 thirds = 12;
}

// ============================================================================
// Debug painting (robot onPaint / getGraphics)
// ============================================================================

message PaintOp {
  oneof op {
    int32 set_color = 1;  // ARGB
    float set_stroke_width = 2;
    float set_font_size = 3;
    Shape draw = 4;
    Shape fill = 5;
    DrawString draw_string = 6;
  }
}

message Shape {
  oneof shape {
    Line line = 1;
    Rect rect = 2;
    Rect oval = 3;
    ArcShape arc = 4;
    Polygon polygon = 5;
  }
}

message Line {
  optional double x1 = 1;
  optional double y1 = 2;
  optional double x2 = 3;
  optional double y2 = 4;
}

message Rect {
  optional double x = 1;
  optional double y = 2;
  optional double width = 3;
  optional double height = 4;
}

// An arc of the ellipse in the frame; angles in degrees as java.awt.geom.Arc2D.
message ArcShape {
  Rect frame = 1;
  optional double start = 2;
  optional double extent = 3;
}

message Polygon {
  repeated double xs = 1;
  repeated double ys = 2;
  // An open path (polyline): the last point isn't joined to the first.
  bool open = 3;
}

message DrawString {
  string text = 1;
  optional double x = 2;
  optional double y = 3;
}

// ============================================================================
// Runner role (design §6)
// ============================================================================

message RunnerInfo {
  // e.g. "jvm", "python", "dotnet", "native"
  repeated string runtimes = 1;
  // "local", "container" or "remote"
  string mode = 2;
  // Whether this runner's CPU measurements can be trusted (design §7.3). Informational:
  // the server trusts a runner that presents its runner token.
  bool trusted_cpu_time = 3;
  // The runner's engine version (design §4.4) and the deterministic rules its robot host
  // follows; the server refuses others than its own.
  uint32 engine_version = 4;
  uint32 deterministic_rules = 5;
  // What its robots run on, e.g. "JVM 21.0.12.1, linux x86_64, sandbox os (...)".
  string platform = 6;
  // How many robots it runs at once; 0: no limit.
  uint32 slots = 7;
}

message RobotPackage {
  // SHA-256 of the package, hex.
  string sha256 = 1;
  oneof source {
    string url = 2;
    bytes inline = 3;
  }
  // e.g. "jvm"
  string runtime = 4;
  // Class (or entry point) to start, e.g. "sample.Fire".
  string entry_point = 5;
}

// A robot to start. A runner agent fetches the jars it doesn't have (JarRequest), starts
// the robot with stdio, connects to the server as that robot with `session_token` and
// relays the robot's stdio, then answers LaunchResult.
message LaunchRobot {
  // The robot's index in the battle, as decimal text (also in the other runner messages).
  string robot_id = 1;
  // Token the robot presents in its Hello.
  string session_token = 2;
  RobotPackage package = 3;
  // Where the robot connects, e.g. "127.0.0.1:7654".
  string server_address = 4;
  // Unique robot name and battle seed, for the robot's own random streams (ADR 0009).
  string robot_name = 5;
  int64 battle_seed = 6;
  bool deterministic = 7;
  uint32 memory_limit_mb = 8;
  // JVM robots: the jars (or packages) the robot is looked up in, in order.
  repeated JarRef jars = 9;
  // The classic name the robot host looks the robot up by (`robot_name` without a
  // duplicate suffix).
  string lookup_name = 10;
}

// A jar by content: the runner caches it by hash.
message JarRef {
  // File name, e.g. "samples-0.1.0.jar" (no folders).
  string name = 1;
  // SHA-256 of the file, hex.
  string sha256 = 2;
  uint64 size = 3;
}

// A runner asks for a jar of a LaunchRobot it doesn't have.
message JarRequest {
  string sha256 = 1;
}

// A part of a requested jar, in order; the last one has `last`.
message JarData {
  string sha256 = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
}

message LaunchResult {
  string robot_id = 1;
  bool ok = 2;
  string error = 3;
}

message StopRobot {
  string robot_id = 1;
}

message RobotExited {
  string robot_id = 1;
  int32 exit_code = 2;
  // The end of the robot's error output, for diagnosis.
  string stderr_tail = 3;
}

// ============================================================================
// Observer role (design §5.4)
// ============================================================================

message BattleInfo {
  BattleRules rules = 1;
  repeated RobotStatics robots = 2;
  // The battle's seed (classic's RANDOMSEED), to show and to fight the battle again.
  int64 seed = 3;
  // A robot from an IDE is in the battle (design §7.4): no time limits, not comparable to
  // real battles.
  bool debug = 4;
}

message TurnSnapshot {
  int32 round = 1;
  int64 turn = 2;
  repeated RobotSnapshot robots = 3;
  repeated BulletSnapshot bullets = 4;
}

enum RobotState {
  ROBOT_STATE_ACTIVE = 0;
  ROBOT_STATE_HIT_WALL = 1;
  ROBOT_STATE_HIT_ROBOT = 2;
  ROBOT_STATE_DEAD = 3;
}

message RobotSnapshot {
  RobotState state = 1;
  optional double x = 2;
  optional double y = 3;
  optional double energy = 4;
  optional double velocity = 5;
  optional double body_heading = 6;
  optional double gun_heading = 7;
  optional double radar_heading = 8;
  optional double gun_heat = 9;
  optional double score = 10;
  optional double total_score = 11;
  Colors colors = 12;
  // Console output this turn.
  string output = 13;
  // Debug paint this turn, if enabled for this robot.
  repeated PaintOp paint = 14;
  // CPU time the robot reported for this turn (Execute.cpu_nanos; the sum when a robot
  // that skipped turns answers several at once). Timing, not battle state: not part of
  // a recording's snapshot hash.
  uint64 cpu_nanos = 15;
  // The turn's CPU budget (Tick.budget_nanos); in deterministic mode, of counted work.
  uint64 budget_nanos = 16;
  // Debug properties set this turn, in order (Execute.debug_properties): changes, as in
  // classic's snapshot; an observer keeps the current values. Not battle state: not part
  // of a recording's snapshot hash.
  repeated DebugProperty debug_properties = 17;
}

enum BulletState {
  BULLET_STATE_FIRED = 0;
  BULLET_STATE_MOVING = 1;
  BULLET_STATE_HIT_VICTIM = 2;
  BULLET_STATE_HIT_BULLET = 3;
  BULLET_STATE_HIT_WALL = 4;
  BULLET_STATE_EXPLODED = 5;
  BULLET_STATE_INACTIVE = 6;
}

message BulletSnapshot {
  int32 owner = 1;
  int32 bullet_id = 2;
  BulletState state = 3;
  optional double x = 4;
  optional double y = 5;
  optional double heading = 6;
  optional double power = 7;
  int32 victim = 8;  // -1 without a victim
  bool explosion = 9;
  int32 frame = 10;
  int32 color = 11;
}

message RoundResult {
  int32 round = 1;
  repeated Results results = 2;
}

message ObserverControl {
  oneof control {
    bool pause = 1;  // true: pause, false: resume
    bool step = 2;   // one turn while paused
    uint32 turns_per_second = 3;  // 0: as fast as possible
    PaintToggle paint = 4;
    // Stop the battle (classic's stop): the engine aborts, the round runs out without
    // pauses or pacing, no further rounds start, and the battle ends with the results so
    // far (the aborted round counts up to the abort).
    bool abort = 5;
    // Kill a robot (classic's "Kill robot" in its console), by robot index: before the
    // next step it dies as if destroyed (energy 0, an explosion), as classic's
    // KillRobotCommand. Ignored for robots already dead.
    int32 kill = 6;
    // A mouse or keyboard event on the battlefield, for interactive robots: delivered
    // with the next turn's events. A mouse move or drag replaces one still queued.
    InputEvent input = 7;
  }
}

message PaintToggle {
  int32 robot_index = 1;
  bool enabled = 2;
}

// ============================================================================
// Recordings (design §11): a battle as the inputs its engine received
// ============================================================================
//
// A recording file is a gzip stream of length-delimited RecordingEntry messages: first
// a header, then every input the server gave the engine, in order. Replaying them into
// a new engine reproduces the battle exactly. A snapshot entry marks each point where
// the server published a TurnSnapshot, with what the engine doesn't know: console
// output, debug paint, CPU times and debug properties.

message RecordingEntry {
  oneof entry {
    RecordingHeader header = 1;
    bool start_round = 2;
    bool finish_round = 3;
    bool step = 4;
    // A robot's Execute brought new commands (applied at the next step).
    RecordedCommands commands = 5;
    // A robot's pending commands are dropped (too many skipped turns). Robot index.
    int32 discard_commands = 6;
    int32 drain_energy = 7;
    int32 disable = 8;
    int32 stop = 9;
    RecordedSnapshot snapshot = 10;
    // An observer stopped the battle (ObserverControl.abort), before the next step.
    bool abort = 11;
    // An observer killed a robot (ObserverControl.kill), before the next step. Robot index.
    int32 kill = 12;
    // An observer's mouse or keyboard event (ObserverControl.input), before the next
    // step: the running interactive robots get it with that step's events. The engine
    // doesn't see it; robots' reactions are recorded as their commands.
    InputEvent input = 13;
  }
}

message RecordingHeader {
  // Version of this format.
  uint32 format = 1;
  // robocode-s release version that recorded it.
  string engine = 2;
  int64 seed = 3;
  BattleRules rules = 4;
  repeated RobotStatics robots = 5;
  // Engine version (design §4.4) the battle ran with; 0 = recorded before engine versions.
  uint32 engine_version = 6;
  // A debug battle (BattleInfo.debug).
  bool debug = 7;
}

message RecordedCommands {
  int32 robot = 1;
  RobotCommands commands = 2;
}

message RecordedSnapshot {
  // Per robot, by index: console output in this snapshot.
  repeated string output = 1;
  // Debug paint, for robots that painted.
  repeated RobotPaint paint = 2;
  // FNV-1a hash of the snapshot without output, paint, CPU times, debug properties and
  // Colors.set_parts, to verify a replay.
  fixed64 check = 3;
  // Per robot, by index: CPU time in this snapshot (RobotSnapshot.cpu_nanos). Empty in
  // recordings made before it was recorded.
  repeated uint64 cpu_nanos = 4;
  // The turn budget (RobotSnapshot.budget_nanos).
  uint64 budget_nanos = 5;
  // Debug properties set, for robots that set any (RobotSnapshot.debug_properties).
  repeated RobotDebugProperties debug_properties = 6;
}

message RobotDebugProperties {
  int32 robot = 1;
  repeated DebugProperty properties = 2;
}

message RobotPaint {
  int32 robot = 1;
  repeated PaintOp ops = 2;
}
